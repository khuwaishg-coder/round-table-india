<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fellowship — Round Table India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  img { max-width: 100%; display: block; }
  body { margin:0; background:#F7F5F1; color:#14161A; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  ::selection { background:#1E3A5F; color:#fff; }
  .nav-inner, .page-wrap { transition: padding .2s ease; }
  @media (max-width: 640px) {
    .nav-inner { padding: 14px 16px !important; }
    .page-wrap { padding: 40px 16px 60px !important; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr) !important; }
  }

  .nav-link { position:relative; }
  .nav-link::after { content:''; position:absolute; left:0; right:100%; bottom:-4px; height:2px; background:#1E3A5F; transition:right .25s ease; }
  .nav-link:hover::after { right:0; }

  .page-title { animation: fade-up .6s ease both; }
  @keyframes fade-up { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .gallery-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .gallery-card { background:#FBFAF7; overflow:hidden; border-radius:18px; box-shadow:0 18px 40px rgba(20,22,26,0.08); }
  .gallery-card img { transition: transform .45s ease; }
  .gallery-card:hover img { transform: scale(1.08); }
  .gallery-card-content { padding:16px; }
  .gallery-card-title { font-size:14px; font-weight:600; line-height:1.3; margin:0 0 6px; }
  .gallery-card-meta { font-size:12px; color:#5B5F66; line-height:1.5; }
  @media (min-width: 641px) and (max-width: 1024px) { .gallery-grid { grid-template-columns: repeat(3, 1fr) !important; } }
</style>
</head>
<body>

<nav style="position:sticky;top:0;z-index:40;background:rgba(247,245,241,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #E3DFD3;">
  <div class="nav-inner" style="max-width:1320px;margin:0 auto;padding:18px 40px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="./assets/logos/rti-logo.png" alt="RTI logo" style="height:36px;width:auto;display:block;" />
      <img src="./assets/logos/rt222-logo.png" alt="Bangalore Titans RT 222" style="height:36px;width:auto;display:block;" />
      <img src="./assets/logos/lc122-logo.png" alt="Bangalore Titans LC 122" style="height:36px;width:auto;display:block;" />
    </div>
    <a href="./index.html" class="nav-link" style="font-size:13px;color:#14161A;text-decoration:none;font-weight:500;display:flex;align-items:center;gap:6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to site
    </a>
  </div>
</nav>

<div class="page-wrap" style="max-width:1320px;margin:0 auto;padding:56px 40px 80px;">
  <div style="font-size:11px;letter-spacing:0.14em;color:#8B7355;font-weight:600;margin-bottom:10px;">FELLOWSHIP</div>
  <h1 class="page-title" style="font-family:'Source Serif 4',serif;font-size:38px;font-weight:500;margin:0 0 20px;">Fellowship Gallery</h1>
  <p style="font-size:15px;line-height:1.75;color:#5B5F66;max-width:720px;margin:0 0 40px;">A dedicated gallery of fellowship moments from our meetings and sports activities, capturing the spirit of our community and events.</p>
  <div id="fellowshipGallery" class="gallery-grid"></div>
</div>

<footer style="background:#14161A;color:#F7F5F1;">
  <div style="max-width:1320px;margin:0 auto;padding:24px 40px;font-size:12px;color:#7C818A;">© 2026 Round Table India. All rights reserved.</div>
</footer>

<script>
  const gallery = document.getElementById('fellowshipGallery');
  const createPhotoCard = (src, title, description) => {
    const card = document.createElement('div');
    card.className = 'gallery-card';
    card.innerHTML = `
      <div style="aspect-ratio:4/3;overflow:hidden;"><img src="${src}" alt="${title}" style="width:100%;height:100%;object-fit:cover;display:block;" /></div>
      <div class="gallery-card-content">
        <div class="gallery-card-title">${title}</div>
        <div class="gallery-card-meta">${description}</div>
      </div>`;
    return card;
  };

  for (let i = 1; i <= 33; i += 1) {
    const id = String(i).padStart(2, '0');
    gallery.appendChild(createPhotoCard(`./meeting-photos/meeting-${id}.jpg`, `Meeting ${i}`, 'Meeting photo from our chapter events'));
  }
  for (let i = 1; i <= 29; i += 1) {
    const id = String(i).padStart(2, '0');
    gallery.appendChild(createPhotoCard(`./sports-photos/sport-${id}.jpg`, `Sports ${i}`, 'Sports fellowship photo'));
  }
</script>

</body>
</html>
